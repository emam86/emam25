# Publishes booknilecruises.net from the admin panel's content.
# Started by the panel's "Publish" button (workflow_dispatch with the job id),
# by hand from the Actions tab, or every hour, when it deploys only if the
# content changed since the last deploy (this is what makes scheduled posts go live).
#
# Repository secrets: BNC_EXPORT_TOKEN (same as export_token in bnc-config.php),
#   FTP_HOST, FTP_USER, FTP_PASS
# Repository variables (optional): BNC_SITE_URL (default https://booknilecruises.net),
#   FTP_DIR (default /: a dedicated FTP account whose folder is the site's public_html),
#   FTP_TLS_VERIFY (default yes; set to no only if the server's certificate does not match FTP_HOST)
name: Publish site

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: Publish job id from the admin panel (optional)
        required: false
        default: ''

concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.BNC_SITE_URL || 'https://booknilecruises.net' }}
      JOB_ID: ${{ inputs.job_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        working-directory: booknilecruises/site
    steps:
      - uses: actions/checkout@v4

      - name: Tell the panel the build started
        if: env.JOB_ID != ''
        env:
          TOKEN: ${{ secrets.BNC_EXPORT_TOKEN }}
        run: ../scripts/publish-status.sh running "Build started"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booknilecruises/site/package-lock.json

      - run: npm ci

      - name: Download the content export
        env:
          TOKEN: ${{ secrets.BNC_EXPORT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            # Not set up yet: hourly runs stay quiet, a manual run says what is missing.
            [ "${{ github.event_name }}" = schedule ] && { echo '{"version":0}' > "$RUNNER_TEMP/export.json"; exit 0; }
            echo "::error::Add the BNC_EXPORT_TOKEN, FTP_HOST, FTP_USER and FTP_PASS repository secrets first."; exit 1
          fi
          curl -fsS --retry 3 -H "Authorization: Bearer $TOKEN" "$SITE_URL/api/export" -o "$RUNNER_TEMP/export.json"
          node -e "const e=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); console.log('export:', e.trips.length, 'trips,', e.posts.length, 'posts,', e.media.length, 'photos')" "$RUNNER_TEMP/export.json"

      - name: Fingerprint the content
        id: content
        run: echo "hash=$(node -e "const e=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); delete e.generated_at; console.log(require('crypto').createHash('sha256').update(JSON.stringify(e)).digest('hex'))" "$RUNNER_TEMP/export.json")" >> "$GITHUB_OUTPUT"

      # Hourly runs stop here when this exact content was already deployed.
      - name: Was this content already published?
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/published
          key: published-${{ steps.content.outputs.hash }}
          lookup-only: true

      - name: Decide
        id: go
        run: |
          if [ "$(node -p "require('$RUNNER_TEMP/export.json').version")" = 0 ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "Publishing is not set up yet."
          elif [ "${{ github.event_name }}" = schedule ] && [ "${{ steps.seen.outputs.cache-hit }}" = true ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "No content changes since the last deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        if: steps.go.outputs.deploy == 'true'
        run: npm test

      - name: Build
        if: steps.go.outputs.deploy == 'true'
        env:
          BNC_EXPORT: ${{ runner.temp }}/export.json
        run: npm run build

      - name: Upload over FTP
        if: steps.go.outputs.deploy == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_DIR: ${{ vars.FTP_DIR || '/' }}
          FTP_TLS_VERIFY: ${{ vars.FTP_TLS_VERIFY || 'yes' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          ../scripts/deploy-ftp.sh dist

      - name: Check the live site
        if: steps.go.outputs.deploy == 'true'
        run: |
          for path in / /trip/ /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$path")
            echo "$path $code"; [ "$code" = 200 ]
          done

      - name: Remember this content as published
        if: steps.go.outputs.deploy == 'true'
        run: echo "${{ steps.content.outputs.hash }}" > "$RUNNER_TEMP/published"

      - uses: actions/cache/save@v4
        if: steps.go.outputs.deploy == 'true'
        with:
          path: ${{ runner.temp }}/published
          key: published-${{ steps.content.outputs.hash }}

      - name: Report the result to the panel
        if: always() && env.JOB_ID != ''
        env:
          TOKEN: ${{ secrets.BNC_EXPORT_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then ../scripts/publish-status.sh succeeded "Published"; else ../scripts/publish-status.sh failed "Build or upload failed, see the run log"; fi
